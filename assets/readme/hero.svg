<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">helix</title>
  <desc id="d">helix, a Unix shell written from scratch in C. A terminal shows the startup dashboard with CPU, memory and disk gauges, then a git-aware prompt running a pipeline.</desc>
  <rect width="1200" height="420" rx="26" fill="#0d1014"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g transform="translate(64 64)">
      <text font-size="16" letter-spacing="3" fill="#6b7785">UNIX SHELL · C · LIBC ONLY</text>
      <text y="96" font-size="96" font-weight="700" fill="#e6edf3" letter-spacing="-3">helix</text>
      <text y="104" x="268" font-size="96" font-weight="700" fill="#3fb950">_</text>
      <text y="156" font-size="26" fill="#9aa7b4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">A shell of your own.</text>
      <text y="192" font-size="26" fill="#9aa7b4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Pipelines, job control, line editor,</text>
      <text y="228" font-size="26" fill="#9aa7b4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">highlighting. All hand written.</text>
      <text y="284" font-size="16" fill="#6b7785">make &amp;&amp; ./helix</text>
    </g>
    <g transform="translate(620 40)">
      <rect width="516" height="340" rx="14" fill="#161b22" stroke="#2a313b"/>
      <circle cx="26" cy="24" r="6" fill="#f85149"/><circle cx="46" cy="24" r="6" fill="#d29922"/><circle cx="66" cy="24" r="6" fill="#3fb950"/>
      <g font-size="16" fill="#c9d1d9">
        <text x="28" y="72">CPU   <tspan fill="#3fb950">█</tspan><tspan fill="#2a313b">█████████</tspan>    8%</text>
        <text x="28" y="98">MEM   <tspan fill="#3fb950">██</tspan><tspan fill="#2a313b">████████</tspan>   18%   7.6 GB</text>
        <text x="28" y="124">DISK  <tspan fill="#3fb950">█</tspan><tspan fill="#2a313b">█████████</tspan>    4%</text>
        <text x="28" y="158" fill="#6b7785">Uptime  0d 2h 8m</text>
        <text x="28" y="212"><tspan fill="#58a6ff">sms</tspan> on <tspan fill="#d2a8ff">Aether</tspan> at <tspan fill="#e3b341">…/Projects/helix</tspan> via <tspan fill="#3fb950"> main *</tspan> ⇡6</text>
        <text x="28" y="244"><tspan fill="#3fb950">❯</tspan> <tspan fill="#3fb950">cat</tspan> log <tspan fill="#79c0ff">|</tspan> <tspan fill="#3fb950">grep</tspan> err <tspan fill="#79c0ff">|</tspan> <tspan fill="#3fb950">wc</tspan> -l</text>
        <text x="28" y="272">12</text>
        <text x="28" y="304"><tspan fill="#f85149">❯</tspan> <tspan fill="#f85149">nope</tspan> <tspan fill="#6b7785">  # unknown command, red</tspan></text>
      </g>
    </g>
  </g>
</svg>
